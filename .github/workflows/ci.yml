name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev --extra audio
      - name: Ruff
        run: uv run ruff check .
      - name: Ty (informational, non-blocking)
        # ty is the primary type checker. It is non-blocking for now while the
        # pre-existing structural diagnostic backlog is worked down; the diagnostic
        # count must not grow (see plans/ for the tracked baseline).
        continue-on-error: true
        run: uv run ty check
      - name: Mypy (informational, non-blocking)
        # Complements ty: surfaces typo-in-comparison (strict_equality) issues that
        # ty cannot catch. It must never gate CI.
        continue-on-error: true
        run: uv run mypy
      - name: Compile
        run: uv run python -m compileall transclip scripts tests
      - name: Unit tests
        run: uv run python -m tests

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev --extra audio --extra mlx
      - name: Ruff
        run: uv run ruff check .
      - name: Compile
        run: uv run python -m compileall transclip scripts tests
      - name: Unit tests
        run: uv run python -m tests
      - name: MLX import smoke
        run: uv run python -c "import platform, mlx; import mlx_audio.stt.models.granite_speech_nar; from mlx_audio.stt.generate import generate_transcription; print(platform.machine(), generate_transcription)"
      - name: macOS hotkey Swift typecheck
        run: |
          uv run python -c "from pathlib import Path; from transclip.desktop.hotkey.macos import build_macos_hotkey_source; Path('/tmp/TransClipHotkey.swift').write_text(build_macos_hotkey_source(Path('/tmp/transclip-toggle'), Path('/tmp/hotkey.log'), Path('/tmp/hotkey-state.tsv')), encoding='utf-8')"
          xcrun swiftc -typecheck /tmp/TransClipHotkey.swift

  windows:
    runs-on: windows-latest
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev --extra audio --extra windows-ui
      - name: Ruff
        run: uv run ruff check .
      - name: Compile
        run: uv run python -m compileall transclip scripts tests
      - name: Unit tests
        run: uv run python -m tests
      - name: Windows integration smoke
        run: uv run python -c "import keyboard, pystray; from PIL import Image; import transclip.desktop.paste.win32; import transclip.desktop.hotkey.windows; import transclip.desktop.tray.win32; print('windows-integration ok')"
