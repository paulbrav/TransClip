[project]
name = "transclip"
version = "0.1.0"
description = "Local-only push-to-talk dictation with local ASR-oriented harnesses."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
audio = ["sounddevice>=0.5", "numpy>=1.26"]
models = ["transformers>=4.52.1", "torch>=2.5", "torchaudio>=2.5", "torchcodec>=0.5", "torchvision>=0.20", "accelerate>=1.0", "soundfile>=0.12", "pillow>=10"]
mlx = ["mlx-audio[stt]>=0.4.4", "huggingface_hub>=0.27", "soundfile>=0.12"]
openvino = ["openvino-genai>=2025.0", "openvino>=2025.0", "huggingface_hub>=0.27", "soundfile>=0.12", "numpy>=1.26"]
macos-ui = ["pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'"]
windows-ui = [
    "pystray>=0.19",
    "pillow>=10",
    "keyboard>=0.13.5; sys_platform == 'win32'",
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Data.Xml.Dom>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
]
dev = [
    "coverage[toml]>=7.10",
    "mypy>=1.11",
    "pytest>=8.4",
    "ruff>=0.12.11",
    "ty>=0.0.1a19",
]

[project.scripts]
transclip = "transclip.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["transclip", "scripts", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"transclip/desktop/paste/win32.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# NOTE: unresolved-import is silenced globally because optional/platform-specific
# deps (AppKit, Foundation, mlx, pystray, keyboard, ...) are not installed in every
# environment. Scoping this per-import is a larger follow-up change; keep as-is for now.
unresolved-import = "ignore"

[tool.ty.src]
# Recommended follow-up: widen this to also check "scripts" and "tests". Both are
# excluded for now because each carries an un-cleared diagnostic backlog beyond the
# scope of this PR (measured 2026-06: +"scripts" ~= +7 diagnostics, +"tests" ~= +259).
include = ["transclip"]

[tool.mypy]
# Informational / non-blocking lane. ty is the primary type checker; mypy is run only
# to cover the ONE gap ty does not flag: typo-in-comparison (Literal/str overlap), via
# strict_equality. Intentionally NOT --strict / disallow_untyped_defs (would flood).
python_version = "3.12"
files = ["transclip"]
ignore_missing_imports = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = false
# Silence the categories ty already reports (the pre-existing structural backlog) so
# this lane is a clean GREEN tripwire whose sole job is to catch comparison-overlap.
# Widening mypy (e.g. disallow_untyped_defs) is a separate follow-up; ty stays primary.
disable_error_code = [
    "arg-type",
    "attr-defined",
    "assignment",
    "return-value",
    "var-annotated",
    "type-var",
    "typeddict-item",
    "func-returns-value",
    "call-arg",
]

[tool.coverage.run]
branch = true
source = ["transclip", "scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
